services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.development
    container_name: course-app
    environment:
      SUBSCRIPTIONS_PERSISTENCE_MODULE: "eventsourcing_umadb"
      UMADB_URI: "http://eventstore:50051"
      OTEL_SERVICE_NAME: course-app
      OTEL_EXPORTER_OTLP_ENDPOINT: http://observability:4317
      PERSISTENCE_MODULE: "eventsourcing.postgres"
      POSTGRES_DBNAME: course_app
      POSTGRES_HOST: projections
      POSTGRES_USER: course_app
      POSTGRES_PASSWORD: secret
      # Bounds /readyz, not just connection setup. This value becomes the pool's
      # checkout timeout, and `max_tracking_id` — the call the readiness probe
      # makes — wraps it in an internal `@retry(max_attempts=10, wait=0.2)`, so
      # the probe's worst case is this number times ten. At the 30s default a
      # readiness check against a stopped Postgres measured 2m01s: far past the
      # healthcheck timeout below, so the clean 503 that names the dependency
      # would be replaced by an opaque timeout that names nothing. Worse, /readyz
      # is a sync handler, so each such probe pins a threadpool worker for those
      # two minutes and a 5s interval would eventually starve the seven routes
      # that still serve fine from the event store. At 1s the same check answers
      # in 5.8s. Both containers share a Docker network here; a deployment where
      # Postgres is farther away wants a larger number and a wider timeout below.
      POSTGRES_CONNECT_TIMEOUT: "1"
    ports:
      - "8000:8000"
    # Covers a process that dies outright — an unopenable store at startup, an
    # OOM kill. It is not what handles a dependency outage: the app stays alive
    # and reports itself unready, which the healthcheck below picks up, because
    # restarting a replica brings back neither the event store nor postgres.
    # Note this service builds `Dockerfile.development`, whose `fastapi dev`
    # reloader outlives its failed worker, so a startup crash leaves the
    # container up and only the healthcheck tells the truth; editing the
    # misconfiguration then reloads it in place. Under the production
    # `Dockerfile` the same failure exits a bare uvicorn and this policy
    # restarts it.
    restart: unless-stopped
    healthcheck:
      # `python:slim` carries no curl, hence urllib rather than `curl -f`.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz').read()",
        ]
      interval: 5s
      # Generous on purpose: /readyz probes each projection's store as well as
      # the event store, and a Postgres read retries internally before it gives
      # up. Too short a timeout would replace a 503 that names the failed
      # dependency with an opaque healthcheck timeout that names nothing. 10s
      # clears the 5.8s a stopped-Postgres probe measured under the
      # POSTGRES_CONNECT_TIMEOUT set above — raise both together or neither.
      timeout: 10s
      retries: 5
      start_period: 10s
    volumes:
      - .:/app
    depends_on:
      projections:
        condition: service_healthy
      observability:
        condition: service_started
      eventstore:
        condition: service_started

  eventstore:
    image: umadb/umadb:0.7.5
    container_name: course-app-eventstore
    command: ["--listen", "0.0.0.0:50051", "--db-path", "/data"]
    volumes:
      - ./eventstore:/data

  projections:
    image: postgres:17.10-alpine
    container_name: course-app-projections
    environment:
      POSTGRES_DB: course_app
      POSTGRES_USER: course_app
      POSTGRES_PASSWORD: secret
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U course_app -d course_app"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 3s
    volumes:
      - ./projections/pgdata:/var/lib/postgresql/data

  observability:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.20.0
    container_name: course-app-observability
    ports:
      - "16686:16686"
